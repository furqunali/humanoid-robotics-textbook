name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ingestion-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run ingestion configuration tests
        run: python -m pytest tests/test_ingest_config.py
